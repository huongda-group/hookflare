name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated types are up to date
        run: |
          pnpm cf-typegen
          git diff --exit-code
      - name: Check migrations match the Drizzle schema
        run: |
          pnpm db:generate
          git diff --exit-code apps/gateway/migrations
          test -z "$(git status --porcelain apps/gateway/migrations)"
      - name: Check migrations are safe
        run: node scripts/check-migrations.mjs --base origin/main
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test:coverage

  e2e:
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build dashboard
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter dashboard exec playwright install --with-deps chromium
      - name: E2E fixture suite
        run: pnpm --filter dashboard e2e redesign.spec.ts
        env:
          CI: "true"
      - name: E2E live suite
        if: ${{ !cancelled() }}
        run: pnpm --filter dashboard e2e smoke.spec.ts --output test-results-live
        env:
          CI: "true"
      - name: Upload Playwright results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/dashboard/test-results
            apps/dashboard/test-results-live
            apps/dashboard/playwright-report
          if-no-files-found: ignore
