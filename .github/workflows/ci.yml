name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated types are up to date
        run: |
          pnpm cf-typegen
          git diff --exit-code
      - name: Check migrations match the Drizzle schema
        run: |
          pnpm db:generate
          git diff --exit-code apps/gateway/migrations
          test -z "$(git status --porcelain apps/gateway/migrations)"
      - name: Check migrations are safe
        run: node scripts/check-migrations.mjs --base origin/main
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test:coverage

  e2e:
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build dashboard
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter dashboard exec playwright install --with-deps chromium
      - name: E2E fixture suite
        run: pnpm --filter dashboard e2e redesign.spec.ts
        env:
          CI: "true"
      - name: E2E live suite
        if: ${{ !cancelled() }}
        run: pnpm --filter dashboard e2e smoke.spec.ts
        env:
          CI: "true"
      - name: Upload Playwright results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/dashboard/test-results
            apps/dashboard/playwright-report
          if-no-files-found: ignore
