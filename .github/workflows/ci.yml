name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated types are up to date
        run: |
          pnpm cf-typegen
          git diff --exit-code
      - name: Check migrations match the Drizzle schema
        run: |
          pnpm db:generate
          git diff --exit-code apps/gateway/migrations
          test -z "$(git status --porcelain apps/gateway/migrations)"
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
